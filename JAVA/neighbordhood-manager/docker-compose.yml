version: '3.8'
services:
  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-admin
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data  
    environment:
      - SQLITE_DATABASE=/data/mydb.db
    command: ["sqlite_web", "-H", "0.0.0.0", "-p", "8080", "/data/mydb.db"]