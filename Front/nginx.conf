server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API : /api/* -> conteneur "api" (:3000). Le trailing slash du proxy_pass
    # retire le préfixe /api (les routes de l'API n'ont pas de préfixe).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers générés par l'API (PDF de contrats…) -> conteneur "api", hors du préfixe /api
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (websocket + long-polling) -> conteneur "api"
    location /socket.io/ {
        proxy_pass http://api:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Fallback SPA (React Router) : tout le reste -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
